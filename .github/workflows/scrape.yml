name: Scrape & Deploy (Live Sources)

# SCORE, Kent, and Kirkland all run true live "who's in custody right now"
# rosters — polled every 30 min like every sibling county monitor. King
# County DAJD is a separate, slower-cadence workflow (see scrape-kcdajd.yml)
# since its Open Data feed only refreshes every few days.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Override the 10% in-custody drop safety check (set to "true")'
        required: false
        default: 'false'

permissions:
  contents: write

# GitHub only honors a fraction of scheduled triggers under load -- running
# every 10 min (instead of 30) is a partial mitigation for that, but it means
# two runs can now realistically overlap if one takes a while. Queue instead
# of canceling: a canceled mid-commit run risks a half-written push, while a
# queued one just runs late. Own group: this is the only workflow writing
# data/score, data/kent and data/kirkland. (A group holds one pending run and
# a newer one replaces it -- fine here, the next run covers the same ground,
# but it's why the daily/2-hourly workflows aren't in this 10-minute group.)
concurrency:
  group: scrape-live-sources
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A queued run was triggered (and its commit fixed) before whatever ran
      # ahead of it in the concurrency group pushed. actions/checkout checks
      # out that triggering commit, so without this a queued run would diff
      # against stale data/score|kent|kirkland and its push would overwrite
      # the newer run's changes.
      - name: Sync to latest main before scraping
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: npm install

      - name: Run scrapers
        id: scrape
        continue-on-error: true
        run: node scrape.js all
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}

      - name: Copy data to frontend public
        run: |
          mkdir -p frontend/public/data
          cp -r data/* frontend/public/data/

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/score data/kent data/kirkland
          git diff --cached --quiet || git commit -m "chore: update live roster data [skip ci]"
          # Push races are expected now that the scrape workflows no longer
          # share one concurrency group: if another workflow pushed first,
          # pull its commit in and try again, up to 3 retries.
          for attempt in 0 1 2 3; do
            if [ "$attempt" -gt 0 ]; then
              echo "Push rejected -- retry $attempt of 3 after pulling the newer commit"
              sleep $((attempt * 5))
            fi
            git pull --no-rebase -X ours
            if git push; then exit 0; fi
          done
          echo "Push still rejected after 3 retries"
          exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

      - name: Fail job if any source failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1
