name: Scrape & Deploy (King County DAJD)

# King County's Open Data booking feed (KCCF/MRJC) is not live — the county
# itself only republishes it every few days — so this runs on its own
# slower cadence instead of the 30-min loop used for the 3 live sources.
# Once daily is already more often than the source data changes.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Shared with scrape-kcportal.yml only -- both write data/kc_dajd, so they
    # must never run at the same time. Other workflows write other files and
    # run in their own groups; the commit step's push retry handles the git-level
    # race with them. Queue rather than cancel.
    concurrency:
      group: scrape-kc-dajd
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A queued run was triggered (and its commit fixed) before whatever ran
      # ahead of it in the concurrency group pushed. actions/checkout checks
      # out that triggering commit, so without this a queued run would scrape
      # on stale data/kc_dajd and its push would overwrite the other
      # workflow's changes. scrape-kcdajd.yml and scrape-kcportal.yml both
      # write data/kc_dajd.
      - name: Sync to latest main before scraping
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A failed install or scrape doesn't end the run here. The health step
      # below decides whether it's been broken long enough to fail (and email).
      - name: Install scraper dependencies
        id: install
        continue-on-error: true
        run: npm install

      - name: Run King County DAJD scraper
        id: scrape
        continue-on-error: true
        run: node scrape.js kcdajd

      - name: Record scraper health
        id: health
        env:
          SCRAPE_HEALTH_FILE: .github/scrape-health-kcdajd.json
          SCRAPE_DATA_PATH: data/kc_dajd
        run: |
          if [ "${{ steps.install.outcome }}" = success ] && [ "${{ steps.scrape.outcome }}" = success ]; then
            bash .github/scripts/scrape-health.sh success
          else
            # Keep the last good data, not whatever a failed run half-wrote.
            git checkout -- data/kc_dajd 2>/dev/null || true
            git clean -fdq data/kc_dajd 2>/dev/null || true
            bash .github/scripts/scrape-health.sh failure
          fi

      # A commit or push problem never fails the run: the next run pushes it.
      - name: Commit data files
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kc_dajd .github/scrape-health-kcdajd.json
          git diff --cached --quiet || git commit -m "chore: update King County DAJD data [skip ci]"
          # Push races are expected now that the scrape workflows no longer
          # share one concurrency group: if another workflow pushed first,
          # pull its commit in and try again, up to 3 retries.
          for attempt in 0 1 2 3; do
            if [ "$attempt" -gt 0 ]; then
              echo "Push rejected -- retry $attempt of 3 after pulling the newer commit"
              sleep $((attempt * 5))
            fi
            git pull --no-rebase -X ours
            if git push; then exit 0; fi
          done
          echo "::warning::Push still rejected after 3 retries; the next run will push this data"

      - name: Fail if the scraper has been broken for 24 hours
        if: steps.health.outputs.fail == 'true'
        run: exit 1

  # Runs after the scrape job, from a fresh checkout of the latest main, so it
  # publishes every source's newest committed data -- not just this workflow's.
  # (A separate workflow triggered on push wouldn't work: pushes made with
  # GITHUB_TOKEN don't trigger other workflows.)
  # A failed build or Pages deploy never fails the workflow; the next run
  # republishes.
  deploy:
    needs: scrape
    continue-on-error: true
    runs-on: ubuntu-latest
    # Shared by all four scrape workflows, so two Pages deploys never overlap.
    # A newer queued deploy replaces a waiting one; that's fine, since every
    # deploy builds from whatever main is when it starts.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy data to frontend public
        run: |
          mkdir -p frontend/public/data
          cp -r data/* frontend/public/data/

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
