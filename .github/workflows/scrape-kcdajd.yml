name: Scrape & Deploy (King County DAJD)

# King County's Open Data booking feed (KCCF/MRJC) is not live — the county
# itself only republishes it every few days — so this runs on its own
# slower cadence instead of the 30-min loop used for the 3 live sources.
# Once daily is already more often than the source data changes.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Same group as scrape.yml -- both workflows commit/push to the same repo
# (different data files, but the same git history), so letting them run
# simultaneously risks a race at the git level regardless of which files
# each touches. Queue instead of canceling for the same reason as there.
concurrency:
  group: scrape-live-sources
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A queued run was triggered (and its commit fixed) before whatever ran
      # ahead of it in the concurrency group pushed. actions/checkout checks
      # out that triggering commit, so without this a queued run would scrape
      # on stale data/kc_dajd and its push would overwrite the other
      # workflow's changes. scrape-kcdajd.yml and scrape-kcportal.yml both
      # write data/kc_dajd.
      - name: Sync to latest main before scraping
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: npm install

      - name: Run King County DAJD scraper
        run: node scrape.js kcdajd

      - name: Copy data to frontend public
        run: |
          mkdir -p frontend/public/data
          cp -r data/* frontend/public/data/

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kc_dajd
          git diff --cached --quiet || git commit -m "chore: update King County DAJD data [skip ci]"
          git pull --no-rebase -X ours
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
