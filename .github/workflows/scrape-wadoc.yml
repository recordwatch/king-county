name: Scrape & Deploy (WA DOC Cross-Reference)

# WA DOC's statewide incarcerated-population listing (~14,000 people,
# ~142 paginated requests) is a reference dataset for cross-referencing
# county jail releases against jail-to-prison transfers -- not something
# that needs 30-min polling. Runs daily, after King County DAJD's own daily
# refresh, since the cross-reference reads KCDAJD's release_reason field.
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: npm install

      - name: Run WA DOC scraper and cross-reference
        run: node scrape.js wadoc

      - name: Copy data to frontend public
        run: |
          mkdir -p frontend/public/data
          cp -r data/* frontend/public/data/

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wadoc
          git diff --cached --quiet || git commit -m "chore: update WA DOC cross-reference data [skip ci]"
          git pull --no-rebase -X ours
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
